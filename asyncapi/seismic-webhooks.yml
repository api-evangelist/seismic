subscription:
  how: >-
    Create an app in Seismic (developer portal > app registration) and configure the webhook URL the
    notifications are delivered to. Events are selected per app.
  docs:
  - https://developer.seismic.com/seismicsoftware/docs/app-registration
  - https://developer.seismic.com/seismicsoftware/docs/events
  - https://developer.seismic.com/seismicsoftware/docs/callbacks
  scopes: [seismic.webhook, seismic.events]
envelope:
  fields:
  - name: id
    description: Unique event identifier.
  - name: version
    description: Event type identifier.
  - name: occurredAt
    description: ISO 8601 timestamp.
  - name: tenantId
    description: Organization identifier.
  - name: tenantName
    description: Organization name.
  - name: data
    description: Event-specific payload.
  - name: application
    description: Emitting service metadata.
  - name: productArea
    description: Emitting product area.
delivery:
  timeout: 10 seconds
  retries:
    schedule:
    - first retry 1 minute after the initial request
    - second retry 10 minutes after the first retry
    - then every 1 hour for 24 further attempts
    max_attempts: 26
  signing:
    header: x-seismic-signature
    algorithm: HMAC-SHA256 over the request body, verified with the app's signing secret
    rotation_header: x-seismic-signature-old
    rotation_window: 30 minutes
    docs:
    - https://developer.seismic.com/seismicsoftware/docs/signing-secret
    - https://developer.seismic.com/seismicsoftware/docs/signing-secret-validation

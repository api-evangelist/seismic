  name: OAuth 2.0
  conforms: true
  evidence: https://auth.seismic.com/.well-known/openid-configuration
  detail: >-
    Authorization server advertises authorization_code, client_credentials, refresh_token,
    device_code and token-exchange grants with client_secret_basic / client_secret_post
    client authentication.
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: https://auth.seismic.com/.well-known/openid-configuration
  detail: >-
    Anonymous discovery document served at the RFC 8414 / OIDC Discovery path with issuer,
    jwks_uri, authorization/token/userinfo/endsession/introspection/revocation endpoints and
    20 standard claims.
- id: rfc7636-pkce

  detail: 'code_challenge_methods_supported: ["plain","S256"].'
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
  conforms: true
  evidence: https://mcp.seismic.com/.well-known/oauth-protected-resource
  detail: >-
    The MCP server answers an unauthenticated POST with 401 and
    WWW-Authenticate: Bearer realm="Seismic", resource_metadata="https://mcp.seismic.com/.well-known/oauth-protected-resource",
    and serves the metadata document anonymously for both the root and /v1 resources.
- id: rfc9727
  name: API Catalog (RFC 9727 / linkset)
  conforms: true
  evidence: https://developer.seismic.com/.well-known/api-catalog
  detail: >-
    application/linkset+json document anchored at https://developer.seismic.com/seismicsoftware
    with a service-doc link to the API reference. Its service-desc href returns 404, so the
    catalog resolves to human documentation rather than a machine description.
- id: scim
  name: SCIM 2.0 (System for Cross-domain Identity Management)
  conforms: true
  evidence: https://developer.seismic.com/seismicsoftware/reference/seismicscimuserandgroupmanagementdeleteauserbyguid
  detail: >-
    Seismic publishes a first-party SCIM 2.0 surface at https://api.seismic.com/scim/v2 with
    Users and Groups resources addressed by GUID, and SCIM 2.0-compliant error responses carrying
    urn:ietf:params:scim:api:messages:2.0:Error.
  domain_standard: true
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: https://developer.seismic.com/seismicsoftware/docs/seismic-mcp-server
  detail: >-
    First-party remote MCP server over Streamable HTTP at https://mcp.seismic.com/v1 and
    https://mcp.seismic.com/v1/tenants/<tenant_name>, documented with connection guides for
    Claude, Copilot Studio, watsonx Orchestrate and Postman.
- id: pagination
  name: Pagination
  conforms: true
  evidence: openapi/seismic-content-api-openapi.yml
  detail: Offset/limit query parameters on list operations.
- id: hmac-webhook-signing
  name: HMAC-SHA256 webhook signing
  conforms: true
  evidence: https://developer.seismic.com/seismicsoftware/docs/signing-secret-validation
  detail: >-
    Every webhook delivery carries x-seismic-signature (HMAC-SHA256 of the body); during secret
    rotation an x-seismic-signature-old header is sent for 30 minutes.

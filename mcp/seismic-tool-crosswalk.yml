findings:
- >-
  The MCP server is not a wrapper over the documented integration API. It is a separate,
  engagement-oriented product surface with its own scopes (seismic.mcp, seismic.engagement.manage,
  seismic.gen-search) and its own tenant-admin permission gate.
- >-
  The MCP surface is read-heavy: 15 of 20 tools read, 5 write (generate link, create DSR, add
  content to DSR, add content to meeting, update meeting metadata). None of the destructive REST
  operations is exposed as a tool.
- >-
  Per-tool inputSchema is unknown. Establishing the real parameter contract requires an
  authenticated tools/list against a provisioned tenant, which this pipeline does not hold.

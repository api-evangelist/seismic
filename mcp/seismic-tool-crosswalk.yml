description: >-
  Binding between Seismic's published MCP tool surface and the REST operations this repo holds.
  The headline finding is a near-total DISJOINT: Seismic's MCP server exposes the buyer-engagement
  side of the platform (Digital Sales Rooms, meetings, LiveSend, generative search, CRM context),
  while the OpenAPI documents in this repo describe the content, LiveDocs, analytics and user
  management side. Only generative search overlaps with a REST operation we hold, and even that is
  a semantic rather than a structural binding. Confidence is set honestly low throughout, because
  anonymous tools/list is auth-gated and the per-tool inputSchema could not be read.

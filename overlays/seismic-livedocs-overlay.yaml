        may double-apply.
      evidence: conventions/seismic-conventions.yml
    x-rate-limit:
      scope: tenant
      window: 60s rolling
      default_limit_per_minute: 600
      headers:
      - X-Seismic-Remaining-Calls
      - X-Seismic-Total-Calls
      retry_after_header: false

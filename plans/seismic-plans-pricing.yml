    name: enterprise_subscription
    type: subscription
    metric: varies
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: true
  elements:
  - name: Seismic Platform
  - name: Seismic API Access
  - name: LiveDocs
  - name: LiveSend
  - name: Reporting API
  - name: Webhooks

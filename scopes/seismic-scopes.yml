notes:
- The MCP resource https://mcp.seismic.com/ advertises scopes_supported [seismic.engagement.manage, seismic.gen-search];
  https://mcp.seismic.com/v1 advertises [seismic.mcp].
- 'Scope names follow two conventions: the public seismic.<area>.<view|manage> family, and an older flat
  internal family (library, reporting, download, webhook). Only the first is documented.'
- The local OpenAPI documents declare a bearer HTTP scheme rather than an oauth2 securityScheme, so derive-oauth-scopes.py
  finds no scopes in the spec; every scope here comes from the provider docs and the live discovery document,
  not from the spec.
